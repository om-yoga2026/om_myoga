
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#eaf7e9">
  <title>OM YOGA | Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f7fff5, #d9f1d4, #fff9e8);
      color: #234b30;
      overflow-x: hidden;
    }

    .login-card {
      position: relative;
      width: 100%;
      max-width: 420px;
      padding: 38px 28px;
      text-align: center;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid #e3d39b;
      border-radius: 25px;
      box-shadow: 0 15px 45px rgba(39, 92, 48, 0.13);
    }

    .logo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      margin-bottom: 14px;
      border-radius: 50%;
    }

    h1 {
      color: #347447;
      font-size: 30px;
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #68796a;
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .gold-line {
      width: 65px;
      height: 3px;
      margin: 0 auto 22px;
      border-radius: 5px;
      background: #c7a54b;
    }

    .google-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      min-height: 52px;
      padding: 12px;
      border: 1px solid #d9ded9;
      border-radius: 12px;
      background: white;
      color: #303630;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .google-button:hover {
      background: #f6fbf5;
      border-color: #76a77b;
      transform: translateY(-1px);
    }

    .google-button:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    .google-icon {
      font-size: 22px;
      font-weight: bold;
      color: #4285f4;
    }

    #status {
      margin-top: 18px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .footer {
      margin-top: 28px;
      color: #7d897c;
      font-size: 12px;
      line-height: 1.7;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      color: #347447;
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <img
      class="logo"
      src="yogalogo.jpg"
      alt="OM YOGA Logo"
      onerror="this.style.display='none'"
    >

    <h1>OM YOGA</h1>
    <div class="gold-line"></div>

    <p class="subtitle">
      Welcome to your journey of wellness and peace.
      Sign in to continue.
    </p>

    <button
      type="button"
      id="googleLoginButton"
      class="google-button"
    >
      <span class="google-icon">G</span>
      <span id="buttonText">Continue with Google</span>
    </button>

    <p id="status" role="status" aria-live="polite">
      Sign in securely with your Google account.
    </p>

    <a class="back-link" href="index.html">
      ← Back to Home
    </a>

    <p class="footer">
      OM YOGA | Wellness &amp; Peace<br>
      Established 2017
    </p>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCmpCfqe7-kvQ3EHD8vS-z9T6DTD8cMVqU",
      authDomain: "om-yoga-app.firebaseapp.com",
      projectId: "om-yoga-app",
      storageBucket: "om-yoga-app.firebasestorage.app",
      messagingSenderId: "864043456085",
      appId: "1:864043456085:web:8d6f930f7bca6f391766dc"
    };

    const button = document.getElementById("googleLoginButton");
    const buttonText = document.getElementById("buttonText");
    const status = document.getElementById("status");

    function showStatus(message, isError = false) {
      status.textContent = message;
      status.style.color = isError ? "#b3261e" : "#347447";
    }

    try {
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);
      const provider = new GoogleAuthProvider();

      provider.setCustomParameters({
        prompt: "select_account"
      });

      button.addEventListener("click", async () => {
        button.disabled = true;
        buttonText.textContent = "Connecting...";
        showStatus("Opening Google sign-in...");

        try {
          const result = await signInWithPopup(auth, provider);

          showStatus("Login successful. Opening your dashboard...");

          // Redirect only after Firebase confirms sign-in.
          window.location.replace("dashboard.html");

        } catch (error) {
          console.error("Google Login Error:", error);

          showStatus(
            "Login failed: " +
            (error.code || "unknown-error") +
            " — " +
            (error.message || "Please try again."),
            true
          );

          button.disabled = false;
          buttonText.textContent = "Continue with Google";
        }
      });

    } catch (error) {
      console.error("Firebase Initialization Error:", error);

      button.disabled = true;

      showStatus(
        "Firebase could not start: " +
        (error.message || "Check your connection and configuration."),
        true
      );
    }
  </script>
</body>
</html>
